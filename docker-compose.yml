# Reference service for the shared compose on the VM at ~/teams/continia-banking/.
# The real deployment merges the `create-scripts-for-videos` service below into the
# existing team docker-compose.yml (which already runs investigate-work-items etc.),
# so one `docker compose up -d` manages them all. This standalone file is the
# version-controlled source of that block; adjust host paths to your VM layout.
services:
  create-scripts-for-videos:
    build:
      context: ./CreateScriptsForVideos
      dockerfile: Dockerfile
    env_file: .env.create-scripts          # secrets: AZURE_DEVOPS_PAT, CONTINIA_API_TOKEN
    environment:
      # Container-side paths (layout, not secrets — keep them here, not in the env file)
      CONTINIA_BANKING_PATH: /repos/continia-banking
      WORKSPACE_OUTPUT_DIR: /app/output
      PTE_OUTPUT_DIR: /app/output          # MUST be writable and NOT inside continia-banking
      CONTINIA_ALC_PATH: /opt/al/bin/linux/alc
      LSP_PLUGIN_PATH: /opt/al-lsp-plugin
    volumes:
      # Claude Code OAuth credentials, shared with the host (re-auth on the host as needed)
      - /home/azureuser/.claude:/home/claude/.claude
      # continia-banking: READ-ONLY navigation/LSP/symbol source
      - /home/azureuser/repos/continia-banking:/repos/continia-banking:ro
      # continia CLI (linux build), provisioned on the host (chmod +x there)
      - /home/azureuser/tools/continia-linux:/opt/continia/continia:ro
      # AL compiler: the AL extension's bin/ (pinned 18.0.2293710); whole dir so Analyzers/ resolve
      - /home/azureuser/tools/al/al-ext/extension/bin:/opt/al/bin:ro
      # AL language-server plugin (linux variant of al-language-server from claude-code-lsps)
      - /home/azureuser/tools/claude-code-lsps/al-language-server-go-linux:/opt/al-lsp-plugin:ro
      # Processed-item state (internal JSON — named volume is fine)
      - create-scripts-state:/app/.state
      # Generated output (PTE + script) — bind-mounted to a host folder beside the
      # compose (~/teams/continia-banking/output) so it's browsable directly (e.g.
      # via WinSCP). The container writes as the `claude` user, so the folder ends
      # up owned by uid 1001.
      - /home/azureuser/teams/continia-banking/output:/app/output
    restart: unless-stopped

volumes:
  create-scripts-state:
