name: BANKSapi PSD2 onboarding
description: Bank Account Setup with Direct communication through BANKSapi - PSD2, up to Connect Bank Account.
start:
  profile: BUSINESS MANAGER
  pageId: 71553588
steps:
  - type: invoke
    target:
      - page: CTS-CB MultiBankAccAssistSetup
      - action: ActionNext
    description: Invoke <caption>Next</caption>
  - type: set-current-row
    target:
